[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geo-causal-bench"
version = "0.1.0"
description = "Assumption-aware benchmark for geo incrementality and panel causal inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Geo-Causal Benchmark Contributors"}]
dependencies = [
  "duckdb>=1.3,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
geox = ["meridian-geox==1.0.1"]
gpu = ["jax[cuda13]==0.10.2", "xgboost>=3.0,<4"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "hatchling>=1.27,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
geocausal = "geocausal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geocausal"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["geocausal"]

[[tool.mypy.overrides]]
module = ["yaml", "sklearn.*", "scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "gpu: requires the local qualified CUDA backend",
  "r: requires the isolated R environment",
  "scientific: validates scientific invariants",
]

[tool.coverage.run]
branch = true
source = ["geocausal"]

[tool.coverage.report]
show_missing = true
fail_under = 80
